<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fleet Dashboard</title>
<style>
:root{color-scheme:light;--font-anthropic-sans:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;--font-anthropic-serif:Georgia,"Times New Roman",serif;
--color-fg:#202124;--color-fg-muted:#5f6368;--color-bg:#e8eaed;--color-panel:#f8f9fa;--color-border-line:#d3d6da;--color-ok:#18794e;--color-warn:#a15c00;--color-bad:#c4302b;--accent:#5f6368;--head:#3c4043;--thead:#e1e3e6;--card:#eef0f2;
--cds-font-size-caption:.75rem;--cds-font-size-body:.875rem;--cds-font-size-heading:1rem;--cds-font-size-title:1.7rem;--cds-font-weight-medium:600;
--cds-gap-xs:.25rem;--cds-gap-sm:.5rem;--cds-gap-md:1rem;--cds-gap-lg:1.5rem;--cds-pad-xs:.25rem;--cds-pad-sm:.5rem;--cds-pad-md:.75rem;--cds-pad-lg:1rem;--cds-radius:8px;--cds-dur-slow:.3s;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--head:#5f6368;--thead:#35373a;--card:#2c2d30;--color-fg:#e8eaed;--color-fg-muted:#9aa0a6;--color-bg:#1c1c1e;--color-panel:#262729;--color-border-line:#3c3d40;--color-ok:#4cc38a;--color-warn:#e5a54a;--color-bad:#f0716b;--accent:#7fb1ee}}
:root[data-theme="dark"]{color-scheme:dark;--head:#5f6368;--thead:#35373a;--card:#2c2d30;--color-fg:#e8eaed;--color-fg-muted:#9aa0a6;--color-bg:#1c1c1e;--color-panel:#262729;--color-border-line:#3c3d40;--color-ok:#4cc38a;--color-warn:#e5a54a;--color-bad:#f0716b;--accent:#7fb1ee}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--color-bg);color:var(--color-fg)}
.wrap{max-width:1500px;margin-inline:auto;padding:clamp(12px,2.5vw,32px)}
.fx-form{display:flex;flex-wrap:wrap;gap:var(--cds-gap-sm);align-items:flex-end;background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:var(--cds-pad-md);margin-bottom:var(--cds-gap-md);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;box-shadow:0 4px 12px rgba(0,0,0,.07)}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--color-bg)}
.fx-form label{display:flex;flex-direction:column;gap:.2rem;font-size:var(--cds-font-size-caption);color:var(--color-fg-muted)}
.fx-form input,.fx-form select{font:inherit;font-size:var(--cds-font-size-body);color:var(--color-fg);background:var(--color-bg);border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:.35rem .5rem;min-width:9rem}
.fx-form .grp{display:flex;gap:var(--cds-gap-sm);flex-wrap:wrap;padding-right:var(--cds-gap-sm);border-right:1px solid var(--color-border-line)}
.fx-form .grp:last-of-type{border-right:0}
.fx-save{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted);min-height:1.2em;flex-basis:100%}
.fx-save.err{color:var(--color-bad)}
.fx-banner{background:var(--color-panel);border:1px solid var(--color-border-line);border-left:3px solid var(--color-bad);border-radius:var(--cds-radius);padding:var(--cds-pad-md);margin-bottom:var(--cds-gap-md);font-size:var(--cds-font-size-body)}
.fx-banner button{margin-top:.5rem}
.skel{height:14rem;border-radius:var(--cds-radius);background:linear-gradient(90deg,var(--color-panel),var(--color-border-line),var(--color-panel));background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}


.fx{font-family:var(--font-anthropic-sans);color:var(--color-fg);font-variant-numeric:tabular-nums}
.fx-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:var(--cds-gap-md);padding-bottom:var(--cds-gap-md);border-bottom:1px solid var(--color-border-line);margin-bottom:var(--cds-gap-md)}
.fx-title{font-family:var(--font-anthropic-serif);font-weight:400;font-size:var(--cds-font-size-title);margin:0;line-height:1.15}
.fx-sub{margin:.35rem 0 0;color:var(--color-fg-muted);font-size:var(--cds-font-size-caption);max-width:90ch}
.fx-live{display:flex;align-items:center;gap:var(--cds-gap-sm);font-size:var(--cds-font-size-caption);color:var(--color-fg-muted)}
.fx-dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--color-ok)}
.fx-btn{font:inherit;font-size:var(--cds-font-size-caption);background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:.3rem .65rem;color:var(--color-fg);cursor:pointer}
.fx :focus-visible{outline:2px solid var(--color-fg);outline-offset:2px}
.fx-ctl{display:flex;flex-wrap:wrap;gap:var(--cds-gap-sm);margin-bottom:var(--cds-gap-md)}
.fx-chip{display:flex;flex-direction:column;background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:.35rem .7rem;min-width:8rem}
.fx-chip .k{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted)}
.fx-chip .v{font-weight:600}
.fx-layout{display:grid;grid-template-columns:15rem minmax(0,1fr);gap:var(--cds-gap-lg);align-items:start}
@media (max-width:860px){.fx-layout{grid-template-columns:1fr}.fx-nav{position:static!important;max-height:none!important}}
.fx-nav{position:sticky;top:calc(var(--form-h,0px) + env(safe-area-inset-top,0px) + .75rem);max-height:calc(100vh - var(--form-h,0px) - 1.5rem);overflow:auto;background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:var(--cds-pad-sm)}
.fx-nav a{display:block;padding:.45rem .55rem;border-radius:calc(var(--cds-radius) - 2px);color:var(--color-fg);text-decoration:none;font-size:var(--cds-font-size-body);line-height:1.25}
.fx-nav a small{display:block;color:var(--color-fg-muted);font-size:var(--cds-font-size-caption)}
.fx-nav a:hover{background:color-mix(in srgb,var(--color-fg) 6%,transparent)}
.fx-nav a.on{background:color-mix(in srgb,var(--color-fg) 10%,transparent);font-weight:600}
.fx-sec{background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:var(--cds-pad-lg);margin-bottom:var(--cds-gap-lg);scroll-margin-top:.75rem}
.fx-sec>h2{margin:0 0 .15rem;font-size:var(--cds-font-size-heading);font-weight:var(--cds-font-weight-medium)}
.fx-sec>.meta{margin:0 0 var(--cds-gap-md);color:var(--color-fg-muted);font-size:var(--cds-font-size-caption)}
.fx-h{margin:var(--cds-gap-md) 0 var(--cds-gap-sm);font-size:var(--cds-font-size-body);font-weight:600}
.fx-note{margin:0 0 var(--cds-gap-md);padding:.5rem .75rem;border-left:3px solid var(--color-border-line);color:var(--color-fg-muted);font-size:var(--cds-font-size-caption);line-height:1.5}
.fx-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,9.5rem),1fr));gap:var(--cds-gap-sm);margin-bottom:var(--cds-gap-md)}
.fx-kpi{border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:var(--cds-pad-md)}
.fx-kpi .l{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted);min-height:2.4em}
.fx-kpi .v{font-family:var(--font-anthropic-serif);font-size:var(--cds-font-size-title);line-height:1.1}
.fx-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr));gap:var(--cds-gap-md);margin-bottom:var(--cds-gap-md);align-items:start}
.fx-card{border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:var(--cds-pad-md);min-width:0}
.fx-card.wide{grid-column:1/-1}
.fx-card h3{margin:0 0 .5rem;font-size:var(--cds-font-size-body);font-weight:600}
.fx-tools{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.4rem}
.fx-tools input{font:inherit;font-size:var(--cds-font-size-caption);color:var(--color-fg);background:var(--color-bg);border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:.25rem .5rem;width:min(100%,14rem)}
.fx-tools span{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted)}
.fx-tw{max-height:28rem;overflow:auto}
.fx table{border-collapse:collapse;width:100%;font-size:var(--cds-font-size-caption)}
.fx th{position:sticky;top:0;background:var(--color-panel);text-align:left;font-weight:600;color:var(--color-fg-muted);border-bottom:1px solid var(--color-border-line);padding:.35rem .5rem;white-space:nowrap;z-index:1}
.fx td{padding:.3rem .5rem;border-bottom:1px solid var(--color-border-line);vertical-align:top}
.fx td.n,.fx th.n{text-align:right;white-space:nowrap}
.fx tr.tot td{font-weight:700;background:color-mix(in srgb,var(--color-fg) 5%,transparent)}
.fx dl.fx-kv{display:grid;grid-template-columns:minmax(0,1fr) auto;margin:0;font-size:var(--cds-font-size-caption)}
.fx dl.fx-kv dt,.fx dl.fx-kv dd{padding:.35rem .25rem;border-bottom:1px solid var(--color-border-line);margin:0}
.fx dl.fx-kv dt{color:var(--color-fg-muted)}
.fx dl.fx-kv dd{text-align:right;font-weight:600;overflow-wrap:anywhere}
.fx dl.fx-kv{grid-template-columns:minmax(8rem,auto) minmax(0,1fr)!important;column-gap:1rem}
.fx-sec>h2{background:var(--head);color:#fff;padding:.55rem .8rem;border-radius:6px;margin:0 0 .5rem}
.fx th{background:var(--thead)!important;color:var(--color-fg)!important}
.fx-kpi{background:var(--card)}
.fx-nav a.on{background:var(--head)!important;color:#fff}
.fx-nav a.on small{color:#dadce0}
.fx-form{border-top:3px solid var(--head)}
.fx-chip{background:var(--card)}
.fx-svg{width:100%;height:auto;display:block}
.fx-svg .fx-t{font-size:10px;fill:var(--color-fg-muted)}
.fx-svg .fx-v{font-size:10px;font-weight:700;fill:var(--color-fg)}
.fx-svg .fx-in{font-weight:700;fill:#fff}
.fx-svg .fx-grid{stroke:var(--color-border-line);stroke-width:1}
.fx-svg .fx-axis{stroke:var(--color-fg-muted);stroke-width:1}
.fx-legend{display:flex;flex-wrap:wrap;gap:.35rem 1rem;font-size:var(--cds-font-size-caption);color:var(--color-fg-muted);margin:-.2rem 0 .4rem}
.fx-legend span{display:inline-flex;align-items:center;gap:.35rem}
.fx-legend i{display:inline-block;width:.9rem;height:.6rem;border-radius:2px}
.fx-pie{display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr);align-items:center;gap:1.25rem}
@media (max-width:520px){.fx-pie{grid-template-columns:1fr}}
.fx-piesvg{width:100%!important;max-width:230px}
.fx-plegend{list-style:none;margin:0;padding:0;min-width:0}
.fx-plegend li{display:flex;align-items:center;gap:.5rem;padding:.4rem 0;border-bottom:1px solid var(--color-border-line);font-size:var(--cds-font-size-body)}
.fx-plegend li span{font-weight:600}
.fx-plegend i{width:.7rem;height:.7rem;border-radius:50%;flex:0 0 auto}
.fx-plegend b{margin-left:auto;font-weight:600;color:var(--color-fg-muted);font-size:var(--cds-font-size-caption)}
.fx-para{margin:.2rem 0 0;font-size:var(--cds-font-size-body);line-height:1.6}
.fx dl.fx-kv .tot{color:var(--color-fg);font-weight:700}
.fx .ok{color:var(--color-ok)} .fx .warn{color:var(--color-warn)} .fx .bad{color:var(--color-bad)}
.fx-fail{display:flex;align-items:center;justify-content:center;gap:.4rem;min-height:12rem;color:var(--color-fg-muted);font-size:var(--cds-font-size-caption)}
.fx-fail::before{content:"";width:.375rem;height:.375rem;border-radius:50%;background:var(--color-bad)}
.fx-empty{min-height:20rem}
[data-dash-source-state=refreshing]{opacity:.55;transition:opacity var(--cds-dur-slow)}
</style>
</head>
<body>

<div class="wrap fx" id="fx">
  <div class="fx-top">
    <div>
      <h1 class="fx-title" id="fx-title">Fleet dashboard</h1>
      <p class="fx-sub" id="fx-sub"></p>
    </div>
    <div class="fx-live"><span class="fx-dot" id="fx-dot"></span><span id="fx-upd">Connecting to Google Sheets…</span><button class="fx-btn" id="fx-refresh" type="button">Refresh now</button></div>
  </div>
  <div id="fx-banner"></div>
  <div class="fx-form" id="fx-form" hidden>
    <div class="grp">
      <label>Selected Day<input type="date" id="c-day" min="2000-01-01" max="2099-12-31"></label>
      <label>Selected Month<select id="c-month"></select></label>
      <label>Contractor<select id="c-con"></select></label>
    </div>
    <div class="grp">
      <label>Star Name / Star ID<input type="text" id="c-star" placeholder="Name or ID, then Enter"></label>
      <label>Start Date<input type="date" id="c-start" min="2000-01-01" max="2099-12-31"></label>
      <label>End Date<input type="date" id="c-end" min="2000-01-01" max="2099-12-31"></label>
    </div>
    <div class="fx-save" id="fx-save">Changing a control writes it to the yellow cell on the Dashboard tab; the sheet recalculates and this page reloads.</div>
  </div>
  <div class="fx-ctl" id="fx-ctl" hidden></div>
  <div class="fx-layout">
    <nav class="fx-nav" id="fx-nav" aria-label="Sections"></nav>
    <main id="fx-main"><div class="skel"></div></main>
  </div>
</div>

<script>
(function () {
  const L = 'ABCDEFGHIJKLMN'.split('');
  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const enc = (s) => String(s).replace(/%/g, '%25').replace(/&/g, '%26').replace(/=/g, '%3D');
  const mark = (e) => e;
  const cells = (row) => L.map((c) => (row[c] || '').trim());
  const filled = (cs) => cs.map((v, i) => (v ? i : -1)).filter((i) => i >= 0);
  const isNum = (s) => { s = String(s).trim(); return /^[-+]?[\d,]*\.?\d+%?$/.test(s) || /^\d{1,2}-[A-Za-z]{3}(-\d{4})?$/.test(s) || /^[A-Za-z]{3} \d{1,2}-[A-Za-z]{3}$/.test(s) || s === '—' || /^not set$/i.test(s) || /^#(N\/A|REF!|ERROR!|VALUE!)/.test(s); };
  const SEC = /^(overview|active stars details|controls|\d+\.\s)/i;
  const statusCls = (v) => { const s = v.toLowerCase(); if (/^(working \(new\)|done|yes)$/.test(s)) return 'ok'; if (/^(left|pending|no|missing)$/.test(s)) return 'bad'; if (/^(replacement \(working\)|pending contractor|pending on sorting|pending audit|pending fleet|pending star)$/.test(s)) return 'warn'; return ''; };
  const totalRow = (t) => /^(total|month total|daily average|all hubs)/i.test(t);

  /* ---------- structure detection ---------- */
  function sections(rows) {
    const out = []; let cur = null;
    rows.forEach((row) => {
      const cs = cells(row), f = filled(cs);
      if (f.length === 1 && f[0] === 0 && SEC.test(cs[0]) && row.r > 2) { cur = { r: row.r, title: cs[0], rows: [] }; out.push(cur); return; }
      if (cur) cur.rows.push(row);
    });
    return out;
  }
  const dashTitle = (rows, k) => { const cs = cells(rows[k]), f = filled(cs); return f.length > 0 && f.every((i) => !isNum(cs[i]) && cs[i].includes('—')); };
  function isHeaderAt(rows, k) {
    const cs = cells(rows[k]), f = filled(cs);
    if (f.length < 2 || f.some((i) => isNum(cs[i])) || dashTitle(rows, k)) return false;
    const nx = rows[k + 1]; if (!nx) return false;
    const n = cells(nx); return filled(n).some((i) => isNum(n[i]));
  }
  function isTitleAt(rows, k) {
    const cs = cells(rows[k]), f = filled(cs);
    if (!f.length || f.some((i) => isNum(cs[i]))) return false;
    if (f.some((i, j) => j && i - f[j - 1] < 2)) return false;
    return dashTitle(rows, k) || (!!rows[k + 1] && isHeaderAt(rows, k + 1));
  }
  function kpiAt(rows, k) {
    const a = rows[k], b = rows[k + 1]; if (!b) return null;
    const ca = cells(a), cb = cells(b), fa = filled(ca), fb = filled(cb);
    if (fa.length < 3 || fa.some((i) => isNum(ca[i]))) return null;
    if (fa.some((i, j) => j && i - fa[j - 1] < 2)) return null;
    if (fa.join() !== fb.join()) return null;
    if (fb.filter((i) => isNum(cb[i])).length < fb.length / 2) return null;
    return { type: 'kpis', items: fa.map((i) => ({ label: ca[i], value: cb[i], r: b.r, col: L[i] })) };
  }
  function parseSection(sec) {
    const items = []; const rows = sec.rows; let block = [];
    const flush = () => { if (block.length) { parseBlock(block).forEach((x) => items.push(x)); block = []; } };
    for (let k = 0; k < rows.length; k++) {
      const cs = cells(rows[k]), f = filled(cs);
      if (!f.length) { flush(); items.push({ type: 'gap' }); continue; }
      if (f.length === 1 && !isNum(cs[f[0]]) && !(rows[k + 1] && filled(cells(rows[k + 1])).length && isHeaderAt(rows, k + 1) && false)) {
        const next = rows[k + 1];
        const single = !next || !filled(cells(next)).length || filled(cells(next)).length >= 1;
        if (single && (cs[f[0]].length > 90 || f[0] === 0 || f[0] > 0)) { flush(); items.push({ type: cs[f[0]].length > 90 ? 'note' : 'heading', text: cs[f[0]], r: rows[k].r, col: L[f[0]] }); continue; }
      }
      const kp = kpiAt(rows, k);
      if (kp) { flush(); items.push(kp); k++; continue; }
      block.push(rows[k]);
    }
    flush();
    return items;
  }
  function parseBlock(rows) {
    const segs = []; let cur = null, title = null;
    for (let k = 0; k < rows.length; k++) {
      if (isTitleAt(rows, k)) { title = rows[k]; continue; }
      if (isHeaderAt(rows, k)) { cur = { title, header: rows[k], rows: [] }; segs.push(cur); title = null; continue; }
      if (!cur || cur.header === undefined) { cur = { title: null, header: null, rows: [] }; segs.push(cur); }
      cur.rows.push(rows[k]);
    }
    const out = [];
    segs.forEach((s) => splitCols(s).forEach((t) => out.push(t)));
    return out;
  }
  function groupKind(cols, header, rows) {
    const all = (header ? [header] : []).concat(rows);
    if (cols.length === 1) return all.length >= 1 && !isNum(cells(all[0])[cols[0]]) ? 'text' : 'plain';
    if (cols.length !== 2) return 'table';
    const [a, b] = cols;
    if (all.some((r) => cells(r)[a] && isNum(cells(r)[a]))) return 'table';
    if (header) {
      const h = cells(header);
      if (/^(field|metric)$/i.test(h[a]) && /^value$/i.test(h[b] || '')) return 'kv';
      const vals = rows.map((r) => cells(r)[b]).filter(Boolean);
      if (vals.length && vals.every((v) => isNum(v))) return 'table';
      return 'kv';
    }
    return 'kv';
  }
  function splitCols(seg) {
    const all = (seg.header ? [seg.header] : []).concat(seg.rows);
    const used = L.map((c, i) => all.some((r) => cells(r)[i]));
    const hidden = L.map((c, i) => !!seg.header && /^chart date$/i.test(cells(seg.header)[i]));
    const starts = new Set(); if (seg.title) filled(cells(seg.title)).forEach((i) => starts.add(i));
    const groups = []; let g = null;
    for (let i = 0; i < L.length; i++) {
      if (!used[i] || hidden[i]) { g = null; continue; }
      if (!g || starts.has(i)) { g = []; groups.push(g); }
      g.push(i);
    }
    return groups.map((cols) => {
      const t = seg.title ? cols.map((i) => cells(seg.title)[i]).filter(Boolean).join(' ') : '';
      const rows = seg.rows.filter((r) => cols.some((i) => cells(r)[i]));
      const base = { title: t, titleR: seg.title && seg.title.r, titleCol: seg.title && L[cols.find((i) => cells(seg.title)[i]) ?? cols[0]], cols, header: seg.header, rows };
      const kind = groupKind(cols, seg.header, rows);
      if (kind === 'kv') {
        const pairs = [];
        const h = seg.header ? cells(seg.header) : null;
        const fieldHdr = h && /^(field|metric)$/i.test(h[cols[0]]) && /^value$/i.test(h[cols[1]] || '');
        if (h && !fieldHdr && h[cols[0]]) pairs.push([h[cols[0]], cols[1] != null ? h[cols[1]] : '']);
        rows.forEach((r) => { const c = cells(r); const k = c[cols[0]], v = cols[1] != null ? c[cols[1]] : ''; if (/^(field|metric)$/i.test(k) && /^value$/i.test(v)) return; if (k || v) pairs.push([k, v]); });
        return Object.assign(base, { type: 'kv', pairs });
      }
      if (kind === 'text') {
        const lines = (seg.header ? [seg.header] : []).concat(rows).map((r) => cells(r)[cols[0]]).filter(Boolean);
        return Object.assign(base, { type: 'text', head: lines[0] || '', lines: lines.slice(1) });

  const MON = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const MONTHS_RE = /^(January|February|March|April|May|June|July|August|September|October|November|December) \d{4}$/;
  let mcp = null, rows = [], built = '', busy = false;
  const toISO = (s) => { const m = String(s || '').trim().match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/); if (!m) return ''; const mi = MON.indexOf(m[2].toLowerCase()); return mi < 0 ? '' : m[3] + '-' + String(mi + 1).padStart(2, '0') + '-' + m[1].padStart(2, '0'); };
  const serial = (iso) => { const [y, m, d] = iso.split('-').map(Number); return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 864e5); };
  const at = (r, c) => { const row = rows.find((x) => x.r === r); return row ? (row[c] || '').trim() : ''; };
  const banner = (msg, btn) => { const b = $('#fx-banner'); b.replaceChildren(); if (!msg) return; const d = el('div', 'fx-banner', msg); if (btn) { const k = el('button', 'fx-btn', btn.label); k.type = 'button'; k.addEventListener('click', btn.fn); d.appendChild(el('br')); d.appendChild(k); } b.appendChild(d); };
  const explain = (e) => {
    const c = e && e.code, s = SERVER;
    if (c === 'needs_reauth') return 'Reconnect ' + s + ' in claude.ai Settings → Connectors, then press Refresh now.';
    if (c === 'server_not_connected' || c === 'selection_required') return 'Add the ' + s + ' connector in claude.ai Settings → Connectors to see this dashboard.';
    if (c === 'not_in_manifest' || c === 'approval_required' || c === 'consent_required') return 'This page needs your permission to use ' + s + '.';
    if (c === 'blocked_by_policy') return 'Your organization blocks ' + s + ' for this page.';
    if (c === 'tool_error') return 'Google Sheets answered with an error: ' + (e.message || '');
    if (c === 'server_unavailable' || c === 'rate_limited') return 'Google Sheets did not answer in time. The page will try again shortly.';
    if (c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') return 'Connectors are not available in this view. Open the dashboard on claude.ai.';
    return 'Could not reach Google Sheets' + (e && e.message ? ': ' + e.message : '.');
  };
  const payloadOf = (res) => { let p = res && res.payload; if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) {} } if ((!p || !p.values) && res && Array.isArray(res.content)) { const t = res.content.find((x) => x.type === 'text'); if (t) { try { p = JSON.parse(t.text); } catch (e) {} } } return p; };
  function accept(res) {
    const p = payloadOf(res);
    if (!p || !Array.isArray(p.values)) { banner('Google Sheets returned no values for the Dashboard tab.'); return; }
    rows = p.values.map((v, i) => { const o = { r: i + 1 }; L.forEach((c, j) => { o[c] = v && v[j] != null ? String(v[j]) : ''; }); return o; });
    banner('');
    const when = res && res.cache && res.cache.storedAt ? new Date(res.cache.storedAt) : new Date();
    $('#fx-upd').textContent = 'Live from the Dashboard tab · updated ' + when.toLocaleTimeString() + ' · checks every minute';
    $('#fx-dot').style.background = '';
    draw();
  }
  function fillControls() {
    const form = $('#fx-form'); form.hidden = false;
    const day = $('#c-day'), mon = $('#c-month'), con = $('#c-con'), star = $('#c-star'), st = $('#c-start'), en = $('#c-end');
    if (document.activeElement !== day) day.value = toISO(at(4, 'B'));
    if (document.activeElement !== st) st.value = toISO(at(5, 'E'));
    if (document.activeElement !== en) en.value = toISO(at(5, 'H'));
    if (document.activeElement !== star) star.value = at(5, 'B');
    // months: every "Month YYYY" value shown anywhere on the Dashboard tab
    const ms = new Set(); rows.forEach((r) => L.forEach((c) => { const v = (r[c] || '').trim(); if (MONTHS_RE.test(v)) ms.add(v); }));
    const curM = at(4, 'E'); if (curM) ms.add(curM);
    const mlist = [...ms].sort((a, b) => new Date('1 ' + a) - new Date('1 ' + b));
    if (document.activeElement !== mon) { mon.replaceChildren(...mlist.map((m) => new Option(m, m))); mon.value = curM; }
    // contractors: the first column of the Contractor Target table on the Dashboard tab
    const names = []; let i = rows.findIndex((r) => (r.A || '').trim() === 'Contractor' && (r.B || '').trim() === 'Target');
    if (i >= 0) for (let k = i + 1; k < rows.length; k++) { const v = (rows[k].A || '').trim(); if (!v || /^total$/i.test(v)) { if (!v && names.length && !(rows[k + 1] && (rows[k + 1].A || '').trim())) break; if (/^total$/i.test(v)) break; continue; } names.push(v); }
    const curC = at(4, 'H'); const clist = ['All'].concat([...new Set(names)].sort((a, b) => a.localeCompare(b))); if (curC && !clist.includes(curC)) clist.push(curC);
    if (document.activeElement !== con) { con.replaceChildren(...clist.map((n) => new Option(n === 'All' ? 'All contractors' : n, n))); con.value = curC || 'All'; }
  }
  /* Outside claude.ai the page reads the Dashboard tab from ONE of these links (set once):
       • "Publish to web" CSV link of the Dashboard tab  (read-only, easiest)
       • Apps Script web app URL from FleetDashboardAPI.gs   (read + filters)
     Put it in EMBEDDED_LINK below, or open the page with ?api=<link>, or paste it in the box the page shows. */
  const EMBEDDED_LINK = 'https://script.google.com/macros/s/AKfycbyj1-zdwrNnahFUxcwpVF6ifHO3KS3NOrhB_LlSP1SIIOwrXbtfVw4n_L3DjY6P8Klg4A/exec';
  const BACKUP_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSt3kPOxS6CBA78DanFw0HBiMny3Gn5b9EJ6o4ZaIVwnr3iVFGNUK7pGnp68T2PQJ74prajwOqlwnCF/pub?output=csv';
  const lsGet = () => { try { return localStorage.getItem('fleetDashLink') || ''; } catch (e) { return ''; } };
  const WEBAPP_URL = (new URLSearchParams(location.search).get('api') || (/^https:/.test(EMBEDDED_LINK) ? EMBEDDED_LINK : '') || lsGet()).trim();
  const isCsv = () => /docs\.google\.com\/spreadsheets\/d\/e\/.+\/pub/.test(WEBAPP_URL) || /output=csv/.test(WEBAPP_URL);
  const hasWeb = () => /^https:\/\/script\.google(usercontent)?\.com\//.test(WEBAPP_URL) || isCsv();
  function parseCSV(t) {
    const out = []; let row = [], f = '', q = false;
    for (let i = 0; i < t.length; i++) { const c = t[i];
      if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true; else if (c === ',') { row.push(f); f = ''; } else if (c === '\n') { row.push(f); out.push(row); row = []; f = ''; } else if (c !== '\r') f += c; }
    if (f !== '' || row.length) { row.push(f); out.push(row); }
    return out;
  }
  async function webGet(params) {
    if (isCsv()) {
      if (params && params.set) throw { message: 'filters are read-only with a Publish-to-web link; change them in the yellow cells of the Dashboard tab' };
      const u = new URL(WEBAPP_URL.includes('output=') ? WEBAPP_URL : WEBAPP_URL + (WEBAPP_URL.includes('?') ? '&' : '?') + 'output=csv'); u.searchParams.set('t', Date.now());
      let r; try { r = await fetch(u.toString()); } catch (e) { throw { message: 'the published link could not be reached' }; }
      if (!r.ok) throw { message: 'the published link answered ' + r.status + ' (check that the Dashboard tab is still published)' };
      const txt = await r.text(); if (/^\s*</.test(txt)) throw { message: 'the link did not return CSV — publish the Dashboard tab as "Comma-separated values (.csv)"' };
      return { values: parseCSV(txt) };
    }
    const u = new URL(WEBAPP_URL); Object.entries(params || {}).forEach(([k, v]) => u.searchParams.set(k, v)); u.searchParams.set('t', Date.now());
    let r; try { r = await fetch(u.toString(), { redirect: 'follow' }); } catch (e) { throw { message: 'the web app could not be reached (check the URL and that access is set to "Anyone")' }; }
    if (!r.ok) throw { message: 'the web app answered ' + r.status };
    let j; try { j = await r.json(); } catch (e) { throw { message: 'the web app did not return data (redeploy it with access "Anyone")' }; }
    if (j && j.error) throw { message: j.error };
    return j;
  }
  async function writeCell(key, value, label) {
    if ((!mcp && !hasWeb()) || busy) return; busy = true;
    const save = $('#fx-save'); save.classList.remove('err'); save.textContent = 'Saving ' + label + ' to the Dashboard tab…';
    try {
      if (!mcp) { accept({ payload: await webGet({ set: CELLS[key], value }) }); save.textContent = label + ' updated.'; return; }
      await mcp.callTool(SERVER, 'update_values', { spreadsheetId: SID, range: 'Dashboard!' + CELLS[key], values: [[value]] }, { cache: false });
      save.textContent = label + ' saved. Recalculating…';
      await new Promise((r) => setTimeout(r, 900));
      const res = await mcp.callTool(SERVER, 'get_values', READ, { cache: { refresh: true } });
      accept(res); save.textContent = label + ' updated.';
    } catch (e) { save.classList.add('err'); save.textContent = explain(e); }
    finally { busy = false; }
  }
  function wireControls() {
    const day = $('#c-day'), mon = $('#c-month'), con = $('#c-con'), star = $('#c-star'), st = $('#c-start'), en = $('#c-end');
    day.addEventListener('change', () => { if (day.value && day.validity.valid) writeCell('day', serial(day.value), 'Selected Day'); });
    st.addEventListener('change', () => { if (st.value && st.validity.valid) writeCell('start', serial(st.value), 'Start Date'); });
    en.addEventListener('change', () => { if (en.value && en.validity.valid) writeCell('end', serial(en.value), 'End Date'); });
    mon.addEventListener('change', () => { if (mon.value) writeCell('month', mon.value, 'Selected Month'); });
    con.addEventListener('change', () => { if (con.value) writeCell('con', con.value, 'Contractor'); });
    star.addEventListener('keydown', (e) => { if (e.key === 'Enter') writeCell('star', star.value.trim(), 'Star Name / ID'); });
    star.addEventListener('change', () => writeCell('star', star.value.trim(), 'Star Name / ID'));
    [day, st, en].forEach((x) => x.addEventListener('blur', fillControls));
  }
  /* menu: show one section at a time; the controls box stays pinned at the top */
  let active = 0;
  function showSec(i, keepScroll) {
    active = Math.max(0, i);
    document.querySelectorAll('.fx-sec').forEach((s, k) => { s.hidden = k !== active; });
    document.querySelectorAll('.fx-nav a').forEach((a, k) => { a.classList.toggle('on', k === active); if (k === active) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    if (!keepScroll) { const m = $('#fx-main'); const fh = $('#fx-form').offsetHeight || 0; const y = m.getBoundingClientRect().top + window.scrollY - fh - 16; if (window.scrollY > y) window.scrollTo({ top: Math.max(0, y) }); }
  }
  new ResizeObserver(() => document.documentElement.style.setProperty('--form-h', ($('#fx-form').offsetHeight || 0) + 'px')).observe($('#fx-form'));
  function draw() {
    const sig = JSON.stringify(rows);
    fillControls();
    if (sig === built) return; built = sig;
    if (at(1, 'A')) $('#fx-title').textContent = at(1, 'A');
    if (at(2, 'A')) $('#fx-sub').textContent = at(2, 'A');
    const secs = sections(rows);
    const ctl = secs.find((s) => /^controls/i.test(s.title));
    const shown = secs.filter((s) => s !== ctl);
    const keep = window.scrollY;
    $('#fx-main').replaceChildren(...shown.map((s, i) => renderSection(s, i)));
    const nav = $('#fx-nav'); nav.replaceChildren();
    shown.forEach((s, i) => {
      const parts = s.title.split('•').map((x) => x.trim()).filter(Boolean);
      const a = el('a'); a.href = '#sec-' + i; a.appendChild(document.createTextNode(parts[0].replace(/\s{2,}/g, ' ')));
      if (parts[1]) a.appendChild(el('small', null, parts.slice(1).join(' · ')));
      a.addEventListener('click', (e) => { e.preventDefault(); showSec(i); });
      nav.appendChild(a);
    });
    try { window.scrollTo(0, keep); } catch (e) {}
    showSec(Math.min(active, shown.length - 1), true);
  }
  const io = { observe() {} };
  function askLink() {
    const b = $('#fx-banner'); b.replaceChildren();
    const d = el('div', 'fx-banner');
    d.appendChild(el('div', null, 'Connect this page to the Dashboard tab: in Google Sheets open File → Share → Publish to web, choose the "Dashboard" tab and "Comma-separated values (.csv)", press Publish, and paste the link here.'));
    const row = el('div'); row.style.cssText = 'display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem';
    const inp = el('input'); inp.type = 'url'; inp.placeholder = 'https://docs.google.com/spreadsheets/d/e/…/pub?gid=…&single=true&output=csv'; inp.style.cssText = 'flex:1 1 22rem;min-width:0;font:inherit;padding:.4rem .55rem;border:1px solid var(--color-border-line);border-radius:var(--cds-radius);background:var(--color-bg);color:var(--color-fg)';
    const go = el('button', 'fx-btn', 'Connect'); go.type = 'button';
    go.addEventListener('click', () => { const v = inp.value.trim(); if (!/^https:\/\//.test(v)) { inp.focus(); return; } try { localStorage.setItem('fleetDashLink', v); } catch (e) {} const u = new URL(location.href); u.searchParams.set('api', v); location.href = u.toString(); });
    row.append(inp, go); d.appendChild(row); b.appendChild(d);
  }
  async function load(manual) {
    try {
      let res;
      if (mcp) res = await mcp.callTool(SERVER, 'get_values', READ, { cache: { refresh: true } });
      else {
        try { res = { payload: await webGet() }; }
        catch (err) {
          if (!BACKUP_CSV || isCsv()) throw err;
          const r = await fetch(BACKUP_CSV + '&t=' + Date.now()); if (!r.ok) throw err;
          res = { payload: { values: parseCSV(await r.text()) } };
          $('#fx-save').textContent = 'Read from the published copy (the web app did not answer): ' + (err.message || '') + '. Filters cannot be saved until it answers.';
        }
      }
      accept(res);
    }
    catch (e) { const btn = ['not_in_manifest', 'approval_required', 'consent_required'].includes(e.code) ? { label: 'Allow and load', fn: () => load(true) } : (e.retryable ? { label: 'Try again', fn: () => load(true) } : null); banner(explain(e), btn); $('#fx-dot').style.background = 'var(--color-bad)'; if (!rows.length) $('#fx-main').replaceChildren(); }
  }
  (async () => {
    wireControls();
    mcp = window.claude && window.claude.use ? await window.claude.use('mcp') : null;
    if (!mcp) {
      if (!hasWeb()) { askLink(); $('#fx-upd').textContent = 'Not connected'; $('#fx-main').replaceChildren(); return; }
      $('#fx-upd').textContent = 'Connecting to the Dashboard tab…';
      if (isCsv()) { ['#c-day', '#c-month', '#c-con', '#c-star', '#c-start', '#c-end'].forEach((s) => { $(s).disabled = true; }); $('#fx-save').textContent = 'Filters follow the yellow cells of the Dashboard tab (change them in the sheet; this page updates within a few minutes).'; }
      await load(true);
      setInterval(() => { if (!busy && document.visibilityState === 'visible') load(false); }, 60000);
      return;
    }
    mcp.watchTool(SERVER, 'get_values', READ, (ev) => {
      if (ev.type === 'data') { if (!busy) accept(ev.result); return; }
      const e = ev.error || {};
      if (['needs_reauth', 'server_not_connected', 'blocked_by_policy', 'approval_required', 'not_in_manifest', 'selection_required', 'consent_required'].includes(e.code)) { rows = []; built = ''; $('#fx-main').replaceChildren(); }
      const btn = ['not_in_manifest', 'approval_required', 'consent_required'].includes(e.code) ? { label: 'Allow and load', fn: () => load(true) } : null;
      banner(explain(e), btn); $('#fx-dot').style.background = 'var(--color-bad)';
    }, { refetchInterval: 60000, cache: { staleTime: 30000 } });
  })();
  $('#fx-refresh').addEventListener('click', () => { if (mcp || hasWeb()) load(true); });
})();

</script>
